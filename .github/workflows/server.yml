name: Mon École - Server checks

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        working-directory: server
        run: npm install

      - name: Prisma generate
        working-directory: server
        run: npx prisma generate
