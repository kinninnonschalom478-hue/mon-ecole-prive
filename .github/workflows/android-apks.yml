name: MON ECOLE - 3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apks.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: parent
            task: ':parent:assembleDebug'
            apk: 'apps/parent/build/outputs/apk/debug/app-parent-debug.apk'
          - app: teacher
            task: ':teacher:assembleDebug'
            apk: 'apps/teacher/build/outputs/apk/debug/app-teacher-debug.apk'
          - app: admin
            task: ':admin:assembleDebug'
            apk: 'apps/admin/build/outputs/apk/debug/app-admin-debug.apk'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "Android SDK: $SDK"
          test -d "$SDK"

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build ${{ matrix.app }}
        run: ./gradlew ${{ matrix.task }} --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f "${{ matrix.apk }}"
          ls -lh "${{ matrix.apk }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MON_ECOLE_${{ matrix.app }}
          path: ${{ matrix.apk }}
          if-no-files-found: error
