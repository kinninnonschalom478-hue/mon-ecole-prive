name: Mon École - Android

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Parent
        run: gradle :apps:parent:assembleDebug --no-daemon

      - name: Build Admin
        run: gradle :apps:admin:assembleDebug --no-daemon

      - name: APKs
        uses: actions/upload-artifact@v4
        with:
          name: mon-ecole-officiel-apks
          path: |
            apps/parent/build/outputs/apk/debug/*.apk
            apps/admin/build/outputs/apk/debug/*.apk
