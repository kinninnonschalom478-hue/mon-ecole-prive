name: Mon École - Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Parent
        run: ./gradlew :parent:assembleDebug --no-daemon --stacktrace

      - name: Build Teacher
        run: ./gradlew :teacher:assembleDebug --no-daemon --stacktrace

      - name: Build Admin
        run: ./gradlew :admin:assembleDebug --no-daemon --stacktrace

      - name: Verify APKs
        run: |
          echo "=== APKs générés ==="
          find . -type f -name "*.apk" -print
          echo "=== Vérification par module ==="
          find parent/build -type f -name "*.apk" -print 2>/dev/null || true
          find teacher/build -type f -name "*.apk" -print 2>/dev/null || true
          find admin/build -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mon-ecole-apks
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
