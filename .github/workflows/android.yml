name: Mon École - Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Parent
        run: ./gradlew :parent:assembleDebug --stacktrace

      - name: Build Teacher
        run: ./gradlew :teacher:assembleDebug --stacktrace

      - name: Build Admin
        run: ./gradlew :admin:assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mon-ecole-apks
          path: |
            parent/build/outputs/apk/debug/*.apk
            teacher/build/outputs/apk/debug/*.apk
            admin/build/outputs/apk/debug/*.apk
