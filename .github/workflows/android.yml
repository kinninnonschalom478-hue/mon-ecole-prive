name: Mon École - Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Parent
        run: ./gradlew :parent:assembleDebug --stacktrace

      - name: Build Teacher
        run: ./gradlew :teacher:assembleDebug --stacktrace

      - name: Build Admin
        run: ./gradlew :admin:assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mon-ecole-apks
          path: |
            parent/build/outputs/apk/debug/*.apk
            teacher/build/outputs/apk/debug/*.apk
            admin/build/outputs/apk/debug/*.apk
